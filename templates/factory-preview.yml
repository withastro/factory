# Preview release workflow for repositories that opt into factory preview
# releases. Copy this to `.github/workflows/factory-preview.yml` in the target
# repository, adapt the build and publish steps, then enable it:
#
#   # .github/factory.yml
#   triage:
#     previewRelease:
#       workflow: factory-preview.yml
#
# The factory dispatches this workflow on the DEFAULT BRANCH and passes the
# agent-authored fix branch as an input, so this definition always stays
# maintainer-controlled.
#
# Contract: report results by creating a check run named
# `factory/preview-release` on the built commit, whose summary contains a
# fenced ```json block of `{"packages":[{"name":"...","url":"..."}]}`. The
# factory reads those URLs, posts them for the reporter to install, and moves
# the issue to `triage: fix pending`. URLs are only accepted on hosts the
# factory trusts (pkg.pr.new by default; see `previewRelease.allowedHosts`).
#
# The work is split across two jobs on purpose. `publish` runs LLM-authored
# lifecycle and build scripts, so it gets no `checks: write`; `report` holds
# that permission and never checks out untrusted code. Pin the actions below to
# commit SHAs if your repository requires it.

name: Factory preview release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Fix branch to publish a preview release for
        required: true
      issue:
        description: Issue number the fix belongs to
        required: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pkg.pr.new authenticates with Actions OIDC
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      packages: ${{ steps.collect.outputs.packages }}
      conclusion: ${{ steps.collect.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      # Resolved before anything can fail, so the report job below always has a
      # commit to attach its check run to.
      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # These two steps execute code from the fix branch. Consider
      # `npm ci --ignore-scripts` if your build does not need lifecycle scripts.
      - run: npm ci

      - run: npm run build

      - name: Publish preview packages
        id: publish
        run: npx pkg-pr-new@0 publish --json /tmp/pkg-pr-new.json --comment=off './packages/*'

      - name: Collect published packages
        id: collect
        if: always()
        env:
          OUTCOME: ${{ steps.publish.outcome }}
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            let packages = [];
            try {
              const report = JSON.parse(readFileSync("/tmp/pkg-pr-new.json", "utf8"));
              packages = (report.packages ?? []).map((entry) => ({
                name: entry.name,
                url: entry.url,
              }));
            } catch {
              // Publishing failed; report an empty package list.
            }
            const conclusion =
              process.env.OUTCOME === "success" && packages.length > 0 ? "success" : "failure";
            appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify({ packages })}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `conclusion=${conclusion}\n`);
          '

  report:
    runs-on: ubuntu-latest
    needs: publish
    if: always() && needs.publish.result != 'cancelled'
    permissions:
      checks: write
    steps:
      - name: Report preview release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.publish.outputs.sha }}
          PACKAGES: ${{ needs.publish.outputs.packages }}
          CONCLUSION: ${{ needs.publish.outputs.conclusion || 'failure' }}
        run: |
          PAYLOAD="${PACKAGES}"
          if [ -z "$PAYLOAD" ]; then PAYLOAD='{"packages":[]}'; fi
          SUMMARY=$(printf '```json\n%s\n```' "$PAYLOAD")
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='factory/preview-release' \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$CONCLUSION" \
            -f 'output[title]=Preview release' \
            -f "output[summary]=$SUMMARY"
